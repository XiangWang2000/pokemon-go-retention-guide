name: Maintain Gen6 Candidate Tests

on:
  push:
    branches:
      - data/gen6-formal-publication
    paths:
      - .github/workflows/maintain-gen6-candidate-tests.yml

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Remove stale Gen5 empty-registry assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old = "expect(CANDIDATE_BATCH_REGISTRY).toHaveLength(0);"
          new = "expect(CANDIDATE_BATCH_REGISTRY.every((entry) => entry.generation !== 5)).toBe(true);"
          changed = []
          for path in sorted(Path("tests").glob("gen5-candidate-*.test.ts")):
              text = path.read_text(encoding="utf-8")
              if old in text:
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  changed.append(str(path))
          if len(changed) != 6:
              raise SystemExit(f"expected six Gen5 candidate test updates, got {len(changed)}: {changed}")
          for path in Path("tests").glob("gen5-candidate-*.test.ts"):
              if old in path.read_text(encoding="utf-8"):
                  raise SystemExit(f"stale empty-registry assertion remains: {path}")
          print("updated:", *changed, sep="\n- ")
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run Gen5/Gen6 candidate tests
        run: npx vitest run tests/gen5-candidate-*.test.ts tests/gen6-candidate-650-679.test.ts

      - name: Commit verified maintenance
        shell: bash
        run: |
          set -euo pipefail
          git add tests/gen5-candidate-*.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: allow Gen6 candidate staging after Gen5 publication"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
