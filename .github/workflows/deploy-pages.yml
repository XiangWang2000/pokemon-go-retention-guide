name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DATABASE_URL: file:./dev.db
  NEXT_PUBLIC_BASE_PATH: /pokemon-go-retention-guide
  NEXT_PUBLIC_SITE_URL: https://xiangwang2000.github.io/pokemon-go-retention-guide/

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Restore Next.js and TypeScript build cache
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
            *.tsbuildinfo
          key: ${{ runner.os }}-pages-build-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'tests/**/*.ts', 'scripts/**/*.ts', 'next.config.ts', 'tsconfig.json', 'site-data/auditSummary.json') }}
          restore-keys: |
            ${{ runner.os }}-pages-build-${{ hashFiles('package-lock.json') }}-
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Snapshot check
        run: npm run sites:snapshot:check -- --pages
      - name: Snapshot failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          output="$(npm run sites:snapshot:check -- --pages 2>&1)"
          status=$?
          printf '%s\n' "$output"
          compact="$(printf '%s' "$output" | tr '\n' ' ' | tr '\r' ' ')"
          echo "::error title=Snapshot check detail::$compact"
          exit 0
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build static export
        run: npm run build
      - name: Verify Pages artifact
        run: npm run pages:verify
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify deployed Pages site
        env:
          PAGES_DEPLOYMENT_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run pages:smoke:deployed
