name: Gen6 Final Publication Preflight

on:
  push:
    branches:
      - preflight/gen6-publication

permissions:
  contents: write

concurrency:
  group: gen6-final-publication-preflight
  cancel-in-progress: true

jobs:
  preflight:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: file:./rebuild-ci.db
      ALLOW_DESTRUCTIVE_REBUILD: "1"
      NEXT_PUBLIC_BASE_PATH: /pokemon-go-retention-guide
      NEXT_PUBLIC_SITE_URL: https://xiangwang2000.github.io/pokemon-go-retention-guide/
    steps:
      - name: Checkout preflight branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Stage final Gen6 publication wiring
        run: python scripts/release/stage-gen6-publication.py

      - name: Validate publication source changes
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npx vitest run tests/gen6-candidate-650-679.test.ts tests/gen6-candidate-680-709.test.ts tests/gen6-candidate-710-721.test.ts tests/gen6-import-plan.test.ts tests/gen6-pvp-evidence.test.ts tests/gen6-release-evidence.test.ts tests/gen6-pve-max-evidence.test.ts tests/generation-audit-coverage.test.ts

      - name: Clean-room rebuild through formal Gen6
        shell: bash
        run: |
          set -euo pipefail
          if ! npx tsx scripts/data/verify-research-rebuild.ts > rebuild.log 2>&1; then
            echo "Research rebuild failed; showing the final 160 log lines."
            tail -n 160 rebuild.log
            exit 1
          fi
          tail -n 60 rebuild.log

      - name: Verify historical published-data integrity
        run: npm run data:verify:published-integrity

      - name: Generate formal review checkpoints
        shell: bash
        run: |
          set -euo pipefail
          npm run review:generate
          npx tsx scripts/review/generate-current-recalibration-report.ts

      - name: Generate release snapshot
        run: npm run release:snapshot

      - name: Restore transient rebuild outputs
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/review/restore-transient-review-outputs.ts
          git restore --worktree -- data/remediation/001-030-metrics.json

      - name: Verify canonical Gen6 counts
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("site-data/manifest.json","utf8")); const e={pokemonSpecies:729,pokemonForms:927,battleVariants:3757,rawEvaluationData:2239,sourceReferences:348,retentionEvaluations:3922,categoryEvaluations:26299,ivRecommendations:13,dashboardRows:3757,homeFamilies:487}; for(const [k,v] of Object.entries(e)){if(m.counts?.[k]!==v) throw new Error(k+": expected "+v+", got "+m.counts?.[k]);} if(m.batch!=="001-721") throw new Error("batch: "+m.batch); if(m.dataVersion!=="2026.09.06-r33") throw new Error("version: "+m.dataVersion); console.log("Canonical Gen6 counts verified.");'

      - name: Verify release contract and generated paths
        run: npm run release:verify -- --generated-paths

      - name: Full repository regression
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm test

      - name: Build and verify GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run pages:verify

      - name: Remove disposable rebuild outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -f rebuild-ci.db rebuild-ci.db-journal rebuild-ci.db-shm rebuild-ci.db-wal rebuild.log

      - name: Commit validated publication tree on preflight branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No publication changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: preflight Gen6 formal release through #721"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi

      - name: Promote validated tree to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data/gen6-formal-publication
          git diff --binary origin/data/gen6-formal-publication HEAD -- . ':(exclude).github/workflows/gen6-publication-preflight.yml' ':(exclude)scripts/release/stage-gen6-publication.py' > /tmp/gen6-publication.patch
          if [ ! -s /tmp/gen6-publication.patch ]; then
            echo "PR branch already matches validated publication tree."
            exit 0
          fi
          git checkout -B data/gen6-formal-publication origin/data/gen6-formal-publication
          git apply --index /tmp/gen6-publication.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: formally publish Gen6 through #721"
          git push origin HEAD:refs/heads/data/gen6-formal-publication
