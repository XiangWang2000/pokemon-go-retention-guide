name: Preflight Gen6 Publication

on:
  push:
    branches:
      - preflight/gen6-publication-fix
    paths:
      - .github/workflows/preflight-gen6-publication.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: file:./dev.db
      NEXT_PUBLIC_BASE_PATH: /pokemon-go-retention-guide
      NEXT_PUBLIC_SITE_URL: https://xiangwang2000.github.io/pokemon-go-retention-guide/
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch stale publication contracts
        shell: python
        run: |
          from pathlib import Path
          import re

          gen5_tests = [
              Path("tests/gen5-pvp-644-649.test.ts"),
              Path("tests/gen5-release-584-613.test.ts"),
              Path("tests/gen5-release-614-643.test.ts"),
              Path("tests/gen5-release-644-649.test.ts"),
          ]
          old = "expect(CANDIDATE_BATCH_REGISTRY).toHaveLength(0);"
          new = "expect(CANDIDATE_BATCH_REGISTRY.map((entry) => entry.generation)).not.toContain(5);"
          for path in gen5_tests:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing stale Gen5 candidate assertion in {path}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          path = Path("tests/gen6-import-plan.test.ts")
          text = path.read_text(encoding="utf-8")
          replacement = '''function rankings(): Gen6RankingSnapshots {
            const paths: Record<Gen6PlanLeague, string> = {
              GREAT: GEN6_LOCAL_RANKING_PATHS.GL,
              ULTRA: GEN6_LOCAL_RANKING_PATHS.UL,
              MASTER: GEN6_LOCAL_RANKING_PATHS.ML,
            };
            const result = {} as Record<Gen6PlanLeague, Gen6PvpRankingRow[]>;
            for (const [league, sourcePath] of Object.entries(paths) as Array<[Gen6PlanLeague, string]>) {
              result[league] = JSON.parse(readFileSync(sourcePath, "utf8").replace(/^\\uFEFF/, "")) as Gen6PvpRankingRow[];
            }
            return result;
          }
          '''
          updated, count = re.subn(
              r"function rankings\(\): Gen6RankingSnapshots \{.*?\n\}\n\nfunction allRows\(\)",
              replacement + "\nfunction allRows()",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("failed to replace Gen6 ranking snapshot adapter")
          path.write_text(updated, encoding="utf-8")

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run targeted regression
        run: >-
          npx vitest run
          tests/gen5-pvp-644-649.test.ts
          tests/gen5-release-584-613.test.ts
          tests/gen5-release-614-643.test.ts
          tests/gen5-release-644-649.test.ts
          tests/gen6-import-plan.test.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Full test suite
        run: npm test

      - name: Static build
        run: npm run build

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git add \
            tests/gen5-pvp-644-649.test.ts \
            tests/gen5-release-584-613.test.ts \
            tests/gen5-release-614-643.test.ts \
            tests/gen5-release-644-649.test.ts \
            tests/gen6-import-plan.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: align staged Gen6 publication contracts"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
