name: Fix Gen5 Publication CI

on:
  push:
    branches:
      - data/gen5-formal-publication
    paths:
      - .github/workflows/fix-gen5-publication-ci.yml

permissions:
  contents: write

concurrency:
  group: fix-gen5-publication-ci
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply publication-contract cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          for path in Path("tests").glob("gen5-*.test.ts"):
              text = path.read_text(encoding="utf-8")
              text = text.replace("expect(CURRENT_DATA_MAX_DEX).toBe(493);", "expect(CURRENT_DATA_MAX_DEX).toBe(649);")
              text = text.replace("expect(BATCH_REGISTRY.at(-1)?.maxDex).toBe(493);", "expect(BATCH_REGISTRY.at(-1)?.maxDex).toBe(649);")
              text = text.replace('it("does not expand the formal published release", () => {', 'it("matches the formal published release scope", () => {')
              path.write_text(text, encoding="utf-8")

          audit = Path("tests/generation-audit-coverage.test.ts")
          text = audit.read_text(encoding="utf-8")
          text = text.replace(
              'it("keeps formal publication scope distinct from research-only Gen 5-9 audit notes", () => {\n'
              '    // This is intentionally a QA assertion, not a success criterion for all-nine-generation\n'
              '    // publication.  It prevents presentation-only notes from being mistaken for runtime data.\n'
              '    expect(CURRENT_DATA_MAX_DEX).toBe(493);',
              'it("keeps Gen6-9 research notes distinct after Gen5 publication", () => {\n'
              '    // Gen5 is now formally published through #649; later-generation audit notes remain\n'
              '    // research-only and must not be mistaken for additional runtime publication.\n'
              '    expect(CURRENT_DATA_MAX_DEX).toBe(649);',
          )
          audit.write_text(text, encoding="utf-8")

          filters = Path("src/lib/evaluation-filters.ts")
          text = filters.read_text(encoding="utf-8")
          anchor = '  "SINNOH",\n  "ALOLA",'
          if anchor not in text:
              raise SystemExit("region filter anchor not found")
          filters.write_text(text.replace(anchor, '  "SINNOH",\n  "UNOVA",\n  "ALOLA",', 1), encoding="utf-8")

          locale = Path("src/locales/zh-TW.ts")
          text = locale.read_text(encoding="utf-8")
          anchor = '    SINNOH: "神奧",\n    ALOLA: "阿羅拉",'
          if anchor not in text:
              raise SystemExit("zh-TW region anchor not found")
          locale.write_text(text.replace(anchor, '    SINNOH: "神奧",\n    UNOVA: "合眾",\n    ALOLA: "阿羅拉",', 1), encoding="utf-8")

          snapshot = Path("tests/static-snapshot.test.ts")
          text = snapshot.read_text(encoding="utf-8")
          replacements = {
              "pokemonSpecies: 502,": "pokemonSpecies: 658,",
              "pokemonForms: 579,": "pokemonForms: 766,",
              "rawEvaluationData: 1545,": "rawEvaluationData: 1995,",
              "sourceReferences: 229,": "sourceReferences: 308,",
              "retentionEvaluations: 2513,": "retentionEvaluations: 3270,",
              "categoryEvaluations: 16436,": "categoryEvaluations: 21735,",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"snapshot count anchor not found: {old}")
              text = text.replace(old, new, 1)
          snapshot.write_text(text, encoding="utf-8")

          for stale in [
              Path("review/001-493-recalibration.json"),
              Path("review/001-493-recalibration.md"),
          ]:
              if stale.exists():
                  stale.unlink()

          stale_scope = []
          for path in Path("tests").glob("gen5-*.test.ts"):
              text = path.read_text(encoding="utf-8")
              if "CURRENT_DATA_MAX_DEX).toBe(493)" in text or "BATCH_REGISTRY.at(-1)?.maxDex).toBe(493)" in text:
                  stale_scope.append(str(path))
          if stale_scope:
              raise SystemExit(f"stale Gen5 #493 scope assertions remain: {stale_scope}")
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run full test suite
        run: npm test

      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: align Gen5 publication contracts"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
