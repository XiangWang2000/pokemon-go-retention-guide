name: Cleanup Gen6 Identity Handoffs

on:
  push:
    branches:
      - data/gen6-formal-publication
    paths:
      - .github/workflows/cleanup-gen6-identity-handoffs.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve #679 -> #680 handoff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          candidate = Path("src/data/candidates/gen6-650-679.ts")
          text = candidate.read_text(encoding="utf-8")
          text = text.replace("  CandidateDeferredEvolutionTarget,\n", "")
          pattern = re.compile(
              r'export const deferredEvolutionTargets650679 = \[\n.*?\n\] as const satisfies readonly CandidateDeferredEvolutionTarget\[\];',
              re.S,
          )
          text, count = pattern.subn("export const deferredEvolutionTargets650679 = [] as const;", text)
          if count != 1:
              raise SystemExit(f"expected one #679 deferred block, got {count}")
          candidate.write_text(text, encoding="utf-8")

          test = Path("tests/gen6-candidate-650-679.test.ts")
          text = test.read_text(encoding="utf-8")
          old = '''  it("defers only Honedge -> Doublade to the next owning slice", () => {\n    expect(deferredEvolutionTargets650679).toEqual([\n      expect.objectContaining({\n        fromFormId: "679-kalos",\n        targetDexNumber: 680,\n        targetFormKey: "KALOS",\n      }),\n    ]);\n  });'''
          new = '''  it("clears the Honedge handoff once #680 is owned by the next slice", () => {\n    expect(deferredEvolutionTargets650679).toEqual([]);\n  });'''
          if old not in text:
              raise SystemExit("Gen6 #650-679 deferred test anchor not found")
          test.write_text(text.replace(old, new, 1), encoding="utf-8")

          manifest_path = Path("research_notes/sources/identity-650-679.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["expected"]["deferredEvolutionTargets"] = []
          manifest["expected"]["resolvedHandoff"] = ["679-kalos", "680-kalos"]
          manifest["boundary"] = (
              "IDENTITY ONLY: this manifest does not assert PvP rank, Pokémon GO release state, "
              "Shadow/Purified/Mega/Max availability, or PvE value. Vivillon evolves only within the matching "
              "18-pattern lineage; Flabébé/Floette/Florges evolve only within matching flower color; "
              "Litleo/Pyroar and Espurr/Meowstic remain gender-matched; Furfrou Form Change is never an evolution edge. "
              "The former #679 Honedge -> #680 Doublade deferred handoff is now materialized by the #680-#709 slice."
          )
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Verify no resolved edge remains deferred
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'kalosForm(680, "679-kalos")' src/data/candidates/gen6-680-709.ts
          if grep -q 'targetDexNumber: 680' src/data/candidates/gen6-650-679.ts; then
            echo "resolved #680 endpoint is still deferred"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run Gen5/Gen6 candidate regression
        run: npx vitest run tests/gen5-candidate-*.test.ts tests/gen6-candidate-*.test.ts

      - name: Commit verified handoff cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add src/data/candidates/gen6-650-679.ts tests/gen6-candidate-650-679.test.ts research_notes/sources/identity-650-679.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: resolve Gen6 identity handoffs"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
