name: Inspect Gen6 PvPoke Ambiguous Rows

on:
  push:
    branches:
      - data/gen6-formal-publication
    paths:
      - .github/workflows/inspect-gen6-pvpoke-ambiguous.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pinned rows
        shell: python
        run: |
          import json, urllib.request
          url = "https://raw.githubusercontent.com/pvpoke/pvpoke/7b96d91fb553780653190ad32de001b5d9086a7f/src/data/gamemaster.json"
          gm = json.load(urllib.request.urlopen(url))
          rows = gm["pokemon"] if isinstance(gm, dict) else gm
          wanted = {
            "meowstic", "meowstic_female",
            "aegislash_blade", "aegislash_shield",
            "zygarde", "zygarde_10", "zygarde_complete",
            "hoopa", "hoopa_confined", "hoopa_unbound",
          }
          for row in rows:
            if row.get("speciesId") in wanted:
              print("AMBIG", json.dumps(row, separators=(",", ":"), sort_keys=True))
