name: Verify GitHub Pages PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DATABASE_URL: file:./dev.db
  NEXT_PUBLIC_BASE_PATH: /pokemon-go-retention-guide
  NEXT_PUBLIC_SITE_URL: https://xiangwang2000.github.io/pokemon-go-retention-guide/

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Restore Next.js and TypeScript build cache
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
            *.tsbuildinfo
          key: ${{ runner.os }}-pages-build-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'tests/**/*.ts', 'scripts/**/*.ts', 'next.config.ts', 'tsconfig.json', 'site-data/auditSummary.json') }}
          restore-keys: |
            ${{ runner.os }}-pages-build-${{ hashFiles('package-lock.json') }}-
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Historical importer adapter integrity
        env:
          DATABASE_URL: file:./gen4-ci.db
        run: |
          npx prisma db push --force-reset
          npm run data:verify:387-416
      - name: Release verification contract
        env:
          DATABASE_URL: file:./rebuild-ci.db
        run: npm run release:verify -- --pages
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build static export
        env:
          DATABASE_URL: file:./rebuild-ci.db
        run: npm run build
      - name: Verify Pages artifact
        run: npm run pages:verify
